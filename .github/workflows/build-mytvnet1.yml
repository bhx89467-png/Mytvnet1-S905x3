name: Build Armbian MytvNet1 S905X3

on:
  workflow_dispatch:
    inputs:
      os_release:
        description: "OS release"
        required: true
        default: "noble"
        type: choice
        options:
          - noble
          - bookworm
          - trixie

      armbian_kernel:
        description: "Kernel series"
        required: true
        default: "6.12.y_6.18.y"
        type: choice
        options:
          - 6.12.y_6.18.y
          - 6.18.y
          - 6.12.y
          - 6.6.y
          - 6.1.y

      image_edition:
        description: "Image edition"
        required: true
        default: "server"
        type: choice
        options:
          - server
          - desktop
          - beta

env:
  TZ: Asia/Ho_Chi_Minh
  BOARD: s905x3-a95xf3
  TESTED_DTB: meson-sm1-a95xf3-air.dtb
  VENDOR_PRETTY: "Armbian MytvNet1 905X3"

jobs:
  build:
    name: build-${{ inputs.os_release }}-${{ inputs.armbian_kernel }}-${{ inputs.image_edition }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout our repo
        uses: actions/checkout@v6

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl jq xz-utils gzip tar unzip \
            parted dosfstools e2fsprogs util-linux \
            gh

      - name: Find latest matching OPhub image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE="${{ inputs.os_release }}"
          EDITION="${{ inputs.image_edition }}"
          KERNEL="${{ inputs.armbian_kernel }}"

          API="https://api.github.com/repos/ophub/amlogic-s9xxx-armbian/releases?per_page=100"
          TAG_PREFIX="Armbian_${RELEASE}_arm64_${EDITION}_"

          case "${KERNEL}" in
            6.12.y_6.18.y)
              KERNEL_RE='_(6\.12|6\.18)\.'
              ;;
            6.18.y)
              KERNEL_RE='_6\.18\.'
              ;;
            6.12.y)
              KERNEL_RE='_6\.12\.'
              ;;
            6.6.y)
              KERNEL_RE='_6\.6\.'
              ;;
            6.1.y)
              KERNEL_RE='_6\.1\.'
              ;;
            *)
              echo "Unsupported kernel: ${KERNEL}"
              exit 1
              ;;
          esac

          echo "Requested:"
          echo "  OS release: ${RELEASE}"
          echo "  Edition:    ${EDITION}"
          echo "  Kernel:     ${KERNEL}"
          echo "  Board:      ${BOARD}"
          echo "Searching OPhub releases..."
          echo "  tag prefix: ${TAG_PREFIX}"
          echo "  release:    ${RELEASE}"
          echo "  edition:    ${EDITION}"
          echo "  kernel re:  ${KERNEL_RE}"
          echo "  family:     amlogic_s905x3"

          RELEASES_JSON="/tmp/ophub-releases.json"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${API}" > "${RELEASES_JSON}"

          echo "Recent matching release tags:"
          jq -r \
            --arg tag_prefix "${TAG_PREFIX}" '
              .[]
              | select(.tag_name | startswith($tag_prefix))
              | .tag_name
            ' "${RELEASES_JSON}" | head -n 10

          ASSET_JSON="$(jq -r \
            --arg tag_prefix "${TAG_PREFIX}" \
            --arg release "_${RELEASE}_" \
            --arg edition "_${EDITION}_" \
            --arg kernel_re "${KERNEL_RE}" '
              [
                .[]
                | select(.tag_name | startswith($tag_prefix))
                | .assets[]
                | select(.name | contains("_amlogic_s905x3_"))
                | select(.name | contains($release))
                | select(.name | contains($edition))
                | select(.name | test($kernel_re))
                | select(.name | endswith(".img.gz") or endswith(".img.xz") or endswith(".img"))
              ]
              | sort_by(.updated_at)
              | reverse
              | .[0] // {}
            ' "${RELEASES_JSON}")"

          IMAGE_URL="$(echo "${ASSET_JSON}" | jq -r '.browser_download_url // empty')"
          IMAGE_NAME="$(echo "${ASSET_JSON}" | jq -r '.name // empty')"

          if [ -z "${IMAGE_URL}" ]; then
            echo "No matching amlogic_s905x3 image found."
            echo
            echo "Debug candidates:"
            jq -r \
              --arg tag_prefix "${TAG_PREFIX}" '
                .[]
                | select(.tag_name | startswith($tag_prefix))
                | .assets[]
                | select(.name | contains("amlogic_s905x3"))
                | .name
              ' "${RELEASES_JSON}" | head -n 80
            exit 1
          fi

          echo "Found image:"
          echo "  ${IMAGE_NAME}"
          echo "  ${IMAGE_URL}"

          echo "IMAGE_URL=${IMAGE_URL}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_ENV}"

      - name: Download and decompress image
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/output/images
          cd build/output/images

          for i in 1 2 3 4 5; do
            echo "Download attempt ${i}: ${IMAGE_NAME}"
            curl -fL \
              --retry 5 \
              --retry-delay 10 \
              --retry-all-errors \
              "${IMAGE_URL}" \
              -o "${IMAGE_NAME}" && break

            sleep $((i * 10))
          done

          case "${IMAGE_NAME}" in
            *.img.gz)
              gzip -df "${IMAGE_NAME}"
              RAW_IMAGE="${IMAGE_NAME%.gz}"
              ;;
            *.img.xz)
              xz -df "${IMAGE_NAME}"
              RAW_IMAGE="${IMAGE_NAME%.xz}"
              ;;
            *.img)
              RAW_IMAGE="${IMAGE_NAME}"
              ;;
            *)
              echo "Unknown image type: ${IMAGE_NAME}"
              exit 1
              ;;
          esac

          test -f "${RAW_IMAGE}"
          echo "RAW_IMAGE=build/output/images/${RAW_IMAGE}" >> "${GITHUB_ENV}"

          ls -lh

      - name: Patch DTB, rootfs overlay, Wi-Fi helper, and release name
        shell: bash
        run: |
          set -euo pipefail

          IMG="${RAW_IMAGE}"
          test -f "${IMG}"

          WORK="${GITHUB_WORKSPACE}/_patch_img"
          rm -rf "${WORK}"
          mkdir -p "${WORK}/rootfs" "${WORK}/bootfs"

          LOOP="$(sudo losetup --find --partscan --show "${IMG}")"
          echo "Loop device: ${LOOP}"

          cleanup() {
            set +e
            sudo umount "${WORK}/bootfs" 2>/dev/null || true
            sudo umount "${WORK}/rootfs" 2>/dev/null || true
            sudo losetup -d "${LOOP}" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 3
          lsblk "${LOOP}"

          sudo mount "${LOOP}p1" "${WORK}/bootfs"
          sudo mount "${LOOP}p2" "${WORK}/rootfs"

          echo "Injecting files/ overlay..."
          if [ -d files ]; then
            sudo cp -a files/. "${WORK}/rootfs/"
          fi

          echo "Forcing tested DTB..."
          if [ -f "${WORK}/bootfs/uEnv.txt" ]; then
            sudo sed -i "s|^FDT=.*|FDT=/dtb/amlogic/${TESTED_DTB}|" "${WORK}/bootfs/uEnv.txt"
          else
            echo "WARNING: uEnv.txt not found in boot partition."
          fi

          echo "Patching VENDORPRETTYNAME..."
          sudo mkdir -p "${WORK}/rootfs/etc"

          if [ -f "${WORK}/rootfs/etc/armbian-image-release" ]; then
            if grep -q '^VENDORPRETTYNAME=' "${WORK}/rootfs/etc/armbian-image-release"; then
              sudo sed -i "s|^VENDORPRETTYNAME=.*|VENDORPRETTYNAME=\"${VENDOR_PRETTY}\"|" "${WORK}/rootfs/etc/armbian-image-release"
            else
              echo "VENDORPRETTYNAME=\"${VENDOR_PRETTY}\"" | sudo tee -a "${WORK}/rootfs/etc/armbian-image-release"
            fi
          else
            echo "VENDORPRETTYNAME=\"${VENDOR_PRETTY}\"" | sudo tee "${WORK}/rootfs/etc/armbian-image-release"
          fi

          echo "Writing MytvNet1 marker..."
          cat <<EOF | sudo tee "${WORK}/rootfs/etc/mytvnet1-release"
          BOARD="MytvNet1 905X3"
          BASE_BOARD="${BOARD}"
          FDT="${TESTED_DTB}"
          OS_RELEASE="${{ inputs.os_release }}"
          IMAGE_EDITION="${{ inputs.image_edition }}"
          KERNEL_SELECTION="${{ inputs.armbian_kernel }}"
          WIFI_CHIP="MediaTek MT7668 SDIO 037a:7608/037a:7668"
          WIFI_DRIVER="wlan_mt76x8_sdio experimental"
          VENDORPRETTYNAME="${VENDOR_PRETTY}"
          EOF

          echo "Ensuring helper scripts are executable..."
          sudo chmod +x "${WORK}/rootfs/usr/local/sbin/mytvnet1-build-mt7668-wifi" 2>/dev/null || true

          echo "Resulting boot uEnv:"
          cat "${WORK}/bootfs/uEnv.txt" || true

          echo "Resulting image release:"
          cat "${WORK}/rootfs/etc/armbian-image-release" || true

          sync
          cleanup
          trap - EXIT

      - name: Recompress image
        shell: bash
        run: |
          set -euo pipefail

          IMG="${RAW_IMAGE}"
          test -f "${IMG}"

          xz -T0 -f "${IMG}"

          FINAL_IMAGE="${IMG}.xz"
          echo "FINAL_IMAGE=${FINAL_IMAGE}" >> "${GITHUB_ENV}"

          sha256sum "${FINAL_IMAGE}" | tee "${FINAL_IMAGE}.sha256"
          ls -lh build/output/images

      - name: Upload GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="Armbian_MytvNet1_S905X3_${{ inputs.os_release }}_${{ inputs.image_edition }}_${{ inputs.armbian_kernel }}_${{ github.run_number }}"
          TAG="${TAG//\//-}"

          NOTES="$(cat <<EOF
          # Armbian MytvNet1 905X3

          - OS release: \`${{ inputs.os_release }}\`
          - Image edition: \`${{ inputs.image_edition }}\`
          - Kernel selection: \`${{ inputs.armbian_kernel }}\`
          - Board: \`${BOARD}\`
          - Tested DTB: \`${TESTED_DTB}\`
          - Ethernet: 100M internal PHY / RMII
          - Wi-Fi chip: MediaTek MT7668 SDIO \`037a:7608 / 037a:7668\`
          - Wi-Fi driver helper: experimental \`wlan_mt76x8_sdio\`
          - VENDORPRETTYNAME: \`${VENDOR_PRETTY}\`

          First boot check:

          \`\`\`bash
          cat /etc/armbian-image-release | grep VENDORPRETTYNAME
          cat /etc/mytvnet1-release
          cat /boot/uEnv.txt
          ip link
          systemctl status mytvnet1-mt7668-wifi.service --no-pager || true
          cat /var/log/mytvnet1-mt7668-build.log || true
          \`\`\`
          EOF
          )"

          gh release create "${TAG}" \
            build/output/images/* \
            --title "${TAG}" \
            --notes "${NOTES}" \
          || gh release upload "${TAG}" build/output/images/* --clobber