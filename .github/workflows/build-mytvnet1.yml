name: Build Armbian MytvNet1 S905X3

on:
  workflow_dispatch:
    inputs:
      os_release:
        description: "OS release"
        required: true
        default: "noble"
        type: choice
        options:
          - noble
          - bookworm
          - trixie
      armbian_kernel:
        description: "Kernel series"
        required: true
        default: "6.12.y_6.18.y"
        type: choice
        options:
          - 6.12.y_6.18.y
          - 6.18.y
          - 6.12.y
          - 6.6.y
      armbian_edition:
        description: "Image edition"
        required: true
        default: "server"
        type: choice
        options:
          - server
          - desktop
          - beta


env:
  TZ: Asia/Ho_Chi_Minh
  BOARD: s905x3-a95xf3
  VENDOR_PRETTY: "Armbian MytvNet1 905X3"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout our repo
        uses: actions/checkout@v6

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl jq xz-utils gzip tar unzip \
            parted dosfstools e2fsprogs util-linux \
            qemu-user-static binfmt-support

      - name: Clone OPhub with retry
        shell: bash
        run: |
          set -e

          for i in 1 2 3 4 5; do
            echo "Clone attempt $i..."
            git clone --depth=1 https://github.com/ophub/amlogic-s9xxx-armbian.git ophub-src && break
            rm -rf ophub-src
            sleep $((i * 10))
          done

          test -d ophub-src || exit 1

      - name: Install OPhub dependencies
        shell: bash
        working-directory: ophub-src
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat compile-kernel/tools/script/ubuntu2404-build-armbian-depends)

      - name: Select base image
        shell: bash
        run: |
          set -e

          case "${{ inputs.os_release }}" in
            noble)
              SITE="https://armbian.tnahosting.net/dl/odroidn2/archive/"
              PATTERN='Armbian.*noble.*.img.xz'
              ;;
            bookworm)
              SITE="https://armbian.tnahosting.net/dl/odroidn2/archive/"
              PATTERN='Armbian.*bookworm.*.img.xz'
              ;;
            trixie)
              SITE="https://armbian.tnahosting.net/dl/odroidn2/archive/"
              PATTERN='Armbian.*trixie.*.img.xz'
              ;;
          esac

          FILE="$(curl -fsSL "$SITE" | grep -oE "$PATTERN" | head -n 1)"
          test -n "$FILE"

          echo "BASE_URL=${SITE}${FILE}" >> "$GITHUB_ENV"
          echo "BASE_FILE=${FILE}" >> "$GITHUB_ENV"

      - name: Download base image
        shell: bash
        working-directory: ophub-src
        run: |
          set -e
          mkdir -p build/output/images

          for i in 1 2 3 4 5; do
            echo "Download attempt $i: ${BASE_URL}"
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
              "${BASE_URL}" \
              -o "build/output/images/${BASE_FILE}" && break
            sleep $((i * 10))
          done

          ls -lh build/output/images

      - name: Add MytvNet1 custom files into OPhub common-files
        shell: bash
        run: |
          set -e

          # OPhub armbian_files behavior copies our rootfs overlay into common-files.
          # files/etc/... becomes /etc/... in the final image.
          if [ -d files ]; then
            sudo cp -a files/. ophub-src/build-armbian/armbian-files/common-files/
          fi

          # Ensure release marker exists even if files/ was incomplete.
          sudo mkdir -p ophub-src/build-armbian/armbian-files/common-files/etc
          cat <<EOF | sudo tee ophub-src/build-armbian/armbian-files/common-files/etc/mytvnet1-release
          BOARD="MytvNet1 905X3"
          BASE_BOARD="s905x3-a95xf3"
          FDT="meson-sm1-a95xf3-air.dtb"
          WIFI_CHIP="MediaTek MT7668 SDIO 037a:7608/037a:7668"
          WIFI_DRIVER="wlan_mt76x8_sdio experimental"
          EOF

      - name: Rebuild Armbian for MytvNet1
        shell: bash
        working-directory: ophub-src
        run: |
          set -e

          sudo ./rebuild \
            -b "${BOARD}" \
            -k "${{ inputs.armbian_kernel }}" \
            -a true \
            -u stable \
            -t ext4 \
            -n mytvnet1

          ls -lh build/output/images

      - name: Patch DTB and VENDORPRETTYNAME
        shell: bash
        working-directory: ophub-src
        run: |
          set -e

          IMG="$(find build/output/images -type f -name '*.img' | head -n1)"
          test -n "$IMG"

          WORK="${GITHUB_WORKSPACE}/_patch_img"
          mkdir -p "$WORK/rootfs" "$WORK/bootfs"

          LOOP="$(sudo losetup --find --partscan --show "$IMG")"
          sleep 3
          lsblk "$LOOP"

          sudo mount "${LOOP}p1" "$WORK/bootfs"
          sudo mount "${LOOP}p2" "$WORK/rootfs"

          # Force tested DTB.
          sudo sed -i 's|^FDT=.*|FDT=/dtb/amlogic/meson-sm1-a95xf3-air.dtb|' "$WORK/bootfs/uEnv.txt"

          # Force visible image name.
          if [ -f "$WORK/rootfs/etc/armbian-image-release" ]; then
            sudo sed -i 's|^VENDORPRETTYNAME=.*|VENDORPRETTYNAME="Armbian MytvNet1 905X3"|' "$WORK/rootfs/etc/armbian-image-release"
          else
            echo 'VENDORPRETTYNAME="Armbian MytvNet1 905X3"' | sudo tee "$WORK/rootfs/etc/armbian-image-release"
          fi

          sync
          sudo umount "$WORK/bootfs"
          sudo umount "$WORK/rootfs"
          sudo losetup -d "$LOOP"

          xz -T0 -f "$IMG"

      - name: Create GitHub Release
        shell: bash
        working-directory: ophub-src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="Armbian_MytvNet1_S905X3_${{ inputs.os_release }}_${{ github.run_number }}"

          gh release create "$TAG" \
            build/output/images/* \
            --title "$TAG" \
            --notes "Armbian MytvNet1 905X3
          - Board: s905x3-a95xf3
          - DTB: meson-sm1-a95xf3-air.dtb
          - Ethernet: 100M internal PHY / RMII
          - Wi-Fi: MT7668 SDIO, experimental wlan_mt76x8_sdio support
          - VENDORPRETTYNAME: Armbian MytvNet1 905X3" \
          || gh release upload "$TAG" build/output/images/* --clobber
            